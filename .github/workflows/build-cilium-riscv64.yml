name: Build Cilium for RISC-V 64 (experimental)

on:
  schedule:
    - cron: '0 8 * * *' # daily at 08:00 UTC (offset from the k3s/Calico builds)
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if release exists'
        type: boolean
        default: false
      version:
        description: 'Override Cilium version (e.g. v1.20.1). Leave empty for latest.'
        type: string
        default: ''

env:
  IMAGE_NAME: cilium-riscv64
  DOCKERHUB_REPO: ${{ vars.DOCKERHUB_USERNAME }}/cilium-riscv64

permissions:
  contents: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(curl -sL https://api.github.com/repos/cilium/cilium/releases/latest \
              | jq -r '.tag_name')
          fi
          VERSION_TAG=$(echo "${VERSION}" | sed 's/+/-/g')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved Cilium version: ${VERSION}"

      - name: Check if already built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_TAG="${{ steps.resolve.outputs.version_tag }}"
          FORCE="${{ inputs.force }}"

          if [[ "$FORCE" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Force build requested"
            exit 0
          fi

          EXISTING=$(gh release view "${VERSION_TAG}-cilium-riscv64" \
            --repo "${{ github.repository }}" \
            --json tagName -q '.tagName' 2>/dev/null || echo "")

          if [[ -n "$EXISTING" ]]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release ${VERSION_TAG}-cilium-riscv64 already exists, skipping"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No release for ${VERSION_TAG}-cilium-riscv64, will build"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      VERSION: ${{ needs.detect.outputs.version }}
      VERSION_TAG: ${{ needs.detect.outputs.version_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cilium
          platforms: linux/riscv64
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}
          cache-from: type=gha,scope=cilium
          cache-to: type=gha,scope=cilium,mode=max

      - name: Extract binaries
        run: |
          docker create --name extract ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }}
          mkdir -p bin cni
          docker cp extract:/usr/bin/cilium-agent ./bin/
          docker cp extract:/usr/bin/cilium-operator-generic ./bin/
          docker cp extract:/cni/ ./cni/
          docker rm extract

      - name: Verify binaries
        run: |
          for f in bin/cilium-agent bin/cilium-operator-generic cni/cilium-cni; do
            file "$f"
            file "$f" | grep -q "RISC-V" || { echo "ERROR: $f is not a RISC-V binary"; exit 1; }
          done
          echo "All binaries verified as RISC-V 64-bit ELF"
          ls -lh bin/ cni/

      - name: Smoke test under QEMU
        run: |
          docker run --rm --platform linux/riscv64 ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }} \
            /usr/bin/cilium-agent --version || echo "WARNING: cilium-agent --version did not succeed"

      - name: Create release archive
        run: |
          tar czf cilium-${{ env.VERSION_TAG }}-linux-riscv64.tar.gz bin/ cni/
          sha256sum cilium-${{ env.VERSION_TAG }}-linux-riscv64.tar.gz > SHA256SUMS
          ls -lh cilium-${{ env.VERSION_TAG }}-linux-riscv64.tar.gz

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker tag ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }} \
            ${{ env.DOCKERHUB_REPO }}:${{ env.VERSION_TAG }}
          docker tag ${{ env.IMAGE_NAME }}:${{ env.VERSION_TAG }} \
            ${{ env.DOCKERHUB_REPO }}:latest
          docker push ${{ env.DOCKERHUB_REPO }}:${{ env.VERSION_TAG }}
          docker push ${{ env.DOCKERHUB_REPO }}:latest

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.VERSION_TAG }}-cilium-riscv64" \
            --repo "${{ github.repository }}" \
            --title "Cilium ${{ env.VERSION }} for RISC-V 64 (experimental)" \
            --notes "Cilium ${{ env.VERSION }} built for linux/riscv64. **Highly experimental**: Cilium has no official riscv64 support upstream. cilium-envoy (L7 proxy) is NOT included. The eBPF datapath is compiled at agent startup on the target node and has not been verified on real RISC-V hardware/kernels - see README.md before using this outside a test cluster.

          **Docker image:**
          \`\`\`bash
          docker pull ${{ env.DOCKERHUB_REPO }}:${{ env.VERSION_TAG }}
          \`\`\`" \
            cilium-${{ env.VERSION_TAG }}-linux-riscv64.tar.gz \
            SHA256SUMS
